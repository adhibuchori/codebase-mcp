# CodeQL: code scanning on pull requests, advanced setup. Default setup is not used on purpose: it
# adds a weekly scheduled scan, and this repository runs no scheduled and no push-triggered
# workflows.
#
#   | Language              | What it covers here                                     |
#   | --------------------- | ------------------------------------------------------- |
#   | actions               | .github/workflows                                       |
#   | javascript-typescript | src/, scripts/ and the Claude Code hook                 |
#
# tests/ is left out: its fixtures are toy services in other languages.
#
# A private repository needs GitHub Code Security to upload results; without it the upload fails,
# so the jobs are skipped until the repository variable CODE_SECURITY is `true`.
name: CodeQL

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private || vars.CODE_SECURITY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the code under analysis
      security-events: write # upload the results to code scanning
      actions: read # lets the upload read this run's metadata in a private repository

    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - tests

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
