# Self Test: everything this repository promises, on every pull request. The last job, Self Test,
# passes only when every other job did, so it is the one status check to require.
#
#   | Job                         | What it proves                                                  |
#   | --------------------------- | --------------------------------------------------------------- |
#   | Gates                       | format, type-aware lint, type-check, comment style, dead code,   |
#   |                             | folder shape, module mocks, double assertions, coverage policy,  |
#   |                             | every test at 100% lines and functions per file, the README     |
#   |                             | pair and version sync against the pull request's base           |
#   | Tests (macOS, Windows)      | the whole suite with real git, ripgrep, SQLite and grammars on   |
#   |                             | the two systems the server runs on                              |
#   | Node runtime (Windows)      | the locked-down laptop path: Node 22.18 without Bun, production  |
#   |                             | dependencies installed with --ignore-scripts, no ripgrep; it     |
#   |                             | indexes, boots, and answers MCP calls over HTTP                 |
#   | Secret Scan                 | gitleaks over the full history and the tree (pinned image)      |
#   | Workflows Lint              | actionlint (pinned image) and zizmor                            |
#
# Every action is pinned by commit SHA and every image by digest. Nothing here needs a secret or a
# write permission, and no job keeps the checkout's token.
name: Self Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Full history: the README pair and version sync compare with the pull request's base.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format and lint
        run: bun run fl:ci

      - name: Type check
        run: bun run type-check

      - name: Comment style
        run: bun run check:comments

      - name: Dead code
        run: bun run check:dead-code

      - name: Folder shape
        run: bun run check:folder-shape

      - name: Module mocks
        run: bun run check:mocks

      - name: Double assertion
        run: bash scripts/check/double-assertion.sh

      - name: Coverage policy
        run: bun run check:coverage-policy

      - name: Tests with coverage
        run: bun run test:coverage

      # The base commit comes through env, never as an expression inside the script.
      - name: README translation pair
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check/readme-pair.mjs --base "$BASE_SHA"

      - name: Version and changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/check/version-sync.ts --base "$BASE_SHA"

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test

  node-runtime:
    name: Node runtime (Windows, no ripgrep)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          package-manager-cache: false

      # What start-windows.bat does on a laptop without Bun: production dependencies only, and no
      # install script runs, so nothing is downloaded or built.
      - name: Install production dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Index, boot and call the server on Node
        env:
          CODEBASE_NO_RIPGREP: '1'
        run: bash scripts/ci/node-runtime.sh

      - name: Server log
        if: ${{ !cancelled() }}
        run: cat server.log || true

  secrets:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Full history: a secret committed and later deleted is still in the history.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (history and tree)
        run: |
          image=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          status=0
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" git . --no-banner --redact --config .gitleaks.toml || status=1
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" dir . --no-banner --redact --config .gitleaks.toml || status=1
          exit "$status"

  workflows:
    name: Workflows Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (with ShellCheck)
        run: |
          image=rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" -color

      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          persona: pedantic
          online-audits: false
          # Findings print as annotations on the pull request; nothing is uploaded, so the job
          # needs no security-events permission.
          advanced-security: false
          annotations: true

  self-test:
    name: Self Test
    if: ${{ always() }}
    needs: [gates, tests, node-runtime, secrets, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # A job skipped or cancelled is not a pass: every result must be success.
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null
